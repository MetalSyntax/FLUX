<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlassReader</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%2300f2fe'/><stop offset='100%' style='stop-color:%237028ff'/></linearGradient></defs><rect width='90' height='90' x='5' y='5' rx='20' fill='%231a1a2e' stroke='url(%23g)' stroke-width='2'/><path d='M30 30 L50 70 L70 30' fill='none' stroke='url(%23g)' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2563eb",
              midnight: "#0b0e1a",
              accent: "#7c3aed",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg-gradient: linear-gradient(180deg, #101628 0%, #07090f 100%);
        --text-main: #ffffff;
        --glass-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      html.theme-black {
        --bg-gradient: linear-gradient(180deg, #000000 0%, #000000 100%);
        --glass-bg: rgba(255, 255, 255, 0.02);
      }

      html.theme-white {
        --bg-gradient: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        --text-main: #0f172a;
        --glass-bg: rgba(15, 23, 42, 0.05);
        --glass-border: rgba(15, 23, 42, 0.1);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        color: var(--text-main);
        transition: background 0.3s ease;
      }
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
      }

      .glass-premium {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      .glass-dark {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(16px) saturate(150%);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .glass-pill {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .page-flip {
        perspective: 2000px;
        transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      }
      
      .page-flip-next-exit {
        animation: pageFlipNext 0.7s cubic-bezier(0.645, 0.045, 0.355, 1.000) forwards;
        transform-origin: left center;
        z-index: 50;
      }
      
      .page-flip-prev-exit {
        animation: pageFlipPrev 0.7s cubic-bezier(0.645, 0.045, 0.355, 1.000) forwards;
        transform-origin: right center;
        z-index: 50;
      }

      .page-flip-next-enter {
        animation: pageFlipEnterNext 0.7s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards;
        transform-origin: right center;
      }

      .page-flip-prev-enter {
        animation: pageFlipEnterPrev 0.7s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards;
        transform-origin: left center;
      }

      @keyframes pageFlipNext {
        0% { transform: rotateY(0deg); opacity: 1; }
        100% { transform: rotateY(-180deg); opacity: 0; }
      }

      @keyframes pageFlipPrev {
        0% { transform: rotateY(0deg); opacity: 1; }
        100% { transform: rotateY(180deg); opacity: 0; }
      }

      @keyframes pageFlipEnterNext {
        0% { transform: rotateY(180deg); opacity: 0; }
        100% { transform: rotateY(0deg); opacity: 1; }
      }

      @keyframes pageFlipEnterPrev {
        0% { transform: rotateY(-180deg); opacity: 0; }
        100% { transform: rotateY(0deg); opacity: 1; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
